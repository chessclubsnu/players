<html>
<head>
<title>명예의 전당</title>

<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Chiron Sung HK', Arial;
    background:#0b1320;
    color:white;
    margin:0;
}
    
.title{
    text-align:center;
    font-size:40px;
    letter-spacing:4px;
    margin:50px 0;
    white-space: pre;
}

/* 체스클럽 로고 */
.center_logo{
  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%, -50%);

  width:600px;
  height:600px;

  background-image:url("image/logo.png");
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;

  opacity:0.35;   /* 배경 느낌 */
  z-index: 0;
  pointer-events:none; /* 클릭 방해 안함 */
}

/* 전체 전시 벽 */

.container{
    position:relative;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:60px;
    padding:40px;

    z-index: 1;
}

/* 한 사람 패널 */

.player{
    width:260px;
    height:420px;
    background:linear-gradient(to bottom,#ffffff 0%,#ffffff 55%,#1b2235 55%,#0f1524 100%);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    transition:0.3s;
}

.player:hover{
    transform:translateY(-8px) scale(1.2);
    box-shadow:0 14px 30px rgba(0,0,0,0.9);
}

/* 사진 영역 */

.photocard{
    width:100%;
    height:230px;
    background-size:cover;
    background-position:center;
    filter:grayscale(20%);
}

/* 설명 영역 */

.description{
    padding:20px;
    text-align:center;
}

.name{
    font-size:22px;
    margin-bottom:10px;
    font-weight:600;
    letter-spacing:1px;
}

.info{
    font-size:14px;
    color:#d4d7e2;
    line-height:1.6;    
    white-space: pre;
}
</style>
</head>

    
<body>
<div class="title">
명예의 전당   HALL OF FAME
</div>

<div class="center_logo"></div>
    
<div class="container">
<!-- player 1 -->
<div class="player">
    <div class="photocard" style="background-image:url('image/hikaru.png');"></div>
    <div class="description">
    <div class="name">히카루</div>
    <div class="info"> 2027.3.14 아레나 나잇 우승자
    Arena Night Winner
    </div>
    </div>
</div>

<!-- player 2 -->
<div class="player">
    <div class="photocard" style="background-image:url('image/magnus.png');"></div>
    <div class="description">
    <div class="name">매그너스</div>
    <div class="info"> 2027.3.28 아레나 나잇 우승자
    Arena Night Winner
    </div>
    </div>
</div>
    
</div>

</body>
</html>
